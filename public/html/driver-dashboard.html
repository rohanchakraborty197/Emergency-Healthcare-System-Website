<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Dashboard - TrackNHeal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TrackNHeal Ambulance Driver Dashboard - Manage rides and availability">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/driver-dashboard.css">
</head>
<body>
    <!-- HEADER -->
    <header class="dd-header">
        <div class="dd-header-left">
            <img src="../assets/website-logo.jpeg" alt="TrackNHeal">
            <h1>🚑 Driver Dashboard</h1>
        </div>
        <div class="dd-header-right">
            <div class="dd-status-toggle" id="statusToggle">
                <button class="status-opt available active" data-status="available" onclick="setDriverStatus('available')">🟢 Available</button>
                <button class="status-opt on_duty" data-status="on_duty" onclick="setDriverStatus('on_duty')">🔴 On Duty</button>
                <button class="status-opt offline" data-status="offline" onclick="setDriverStatus('offline')">⚫ Offline</button>
            </div>
            <span class="dd-driver-name" id="driverName">Driver</span>
            <button class="dd-logout" onclick="driverLogout()">Logout</button>
        </div>
    </header>

    <!-- STATS -->
    <section class="dd-stats">
        <div class="stat-card">
            <div class="stat-icon">📋</div>
            <div class="stat-num" id="statAvailable">0</div>
            <div class="stat-label">Available Rides</div>
        </div>
        <div class="stat-card active-card">
            <div class="stat-icon">🚨</div>
            <div class="stat-num" id="statActive">0</div>
            <div class="stat-label">My Active Rides</div>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #f1c40f, #f39c12); color: white;">
            <div class="stat-icon">⭐</div>
            <div class="stat-num" id="statRating" style="color: white;">5.0</div>
            <div class="stat-label" style="color: rgba(255,255,255,0.9);">My Rating</div>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #27ae60, #2ecc71); color: white;">
            <div class="stat-icon">💰</div>
            <div class="stat-num" id="statEarnings" style="color: white;">₹0</div>
            <div class="stat-label" style="color: rgba(255,255,255,0.9);">Total Earnings</div>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white;">
            <div class="stat-icon">📈</div>
            <div class="stat-num" id="statTrips" style="color: white;">0</div>
            <div class="stat-label" style="color: rgba(255,255,255,0.9);">Lifetime Trips</div>
        </div>
    </section>

    <!-- AVAILABLE RIDES -->
    <main class="dd-main">
        <div class="dd-section">
            <div class="dd-section-head">
                <h2>🚨 Available Rides</h2>
                <button class="dd-refresh" onclick="loadRides()">🔄 Refresh</button>
            </div>
            <div class="dd-rides-grid" id="availableRides">
                <div class="dd-empty"><div class="icon">⏳</div><p>Loading rides...</p></div>
            </div>
        </div>

        <!-- MY ACTIVE RIDES -->
        <div class="dd-section">
            <div class="dd-section-head">
                <h2>🗺️ My Active Rides</h2>
            </div>
            <div class="dd-rides-grid" id="myActiveRides">
                <div class="dd-empty"><div class="icon">📭</div><p>No active rides</p></div>
            </div>
        </div>

        <!-- RIDE HISTORY -->
        <div class="dd-section">
            <div class="dd-section-head">
                <h2>📋 Ride History</h2>
            </div>
            <div class="dd-rides-grid" id="rideHistory">
                <div class="dd-empty"><div class="icon">⏳</div><p>Loading history...</p></div>
            </div>
        </div>
    </main>

    <script src="../js/driver-dashboard.js"></script>
</body>
</html>
